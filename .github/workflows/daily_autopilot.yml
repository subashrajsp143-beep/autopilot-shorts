name: Daily YouTube Shorts Autopilot

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

on:
  schedule:
    # 05:45 UTC = 11:15 AM IST (Channel 1: MiniTalesWorld Zack 3D Hindi Explainers)
    - cron: '45 5 * * *'
    # 09:30 UTC = 03:00 PM IST (Channel 2: Pawsome Productions Viral Gaming Clips)
    - cron: '30 9 * * *'
    # 14:30 UTC = 08:00 PM IST (Channel 3: Next Level Facts Trending Viral Clips)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target Channel (1, 2, 3, or all)'
        required: false
        default: 'all'
        type: string
      force:
        description: 'Force upload bypassing duplicate guard'
        required: false
        default: false
        type: boolean

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Install FFmpeg, Chrome & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb || true
            sudo apt-get install -y /tmp/chrome.deb || sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            rm -f /tmp/chrome.deb
          fi
          fc-cache -fv || true

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp edge-tts

      - name: 🚀 Generate Fresh Shorts & Auto-Upload to YouTube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_QUOTA_CH1: "6"
          DAILY_QUOTA_CH2: "6"
          DAILY_QUOTA_CH3: "6"
        run: |
          TARGET_CH="${{ inputs.channel }}"
          SCHED_CRON="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SCHED_CRON" = "45 5 * * *" ]; then
              TARGET_CH="1"
            elif [ "$SCHED_CRON" = "30 9 * * *" ]; then
              TARGET_CH="2"
            elif [ "$SCHED_CRON" = "30 14 * * *" ]; then
              TARGET_CH="3"
            else
              TARGET_CH="all"
            fi
          fi
          if [ -z "$TARGET_CH" ]; then
            TARGET_CH="all"
          fi

          echo "Targeting Channel: $TARGET_CH"
          CMD_ARGS="--upload-yt"
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --force"
          fi
          if [ "$TARGET_CH" != "all" ] && [ -n "$TARGET_CH" ]; then
            CMD_ARGS="$CMD_ARGS --channels $TARGET_CH"
          fi

          python batch_runner.py $CMD_ARGS

      - name: 💾 Persist Upload History & Generator State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A config/
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist uploaded history and state [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "Error: Failed to push config updates to origin main after 5 attempts."
              exit 1
            fi
          else
            echo "No changes to config/ history to commit."
          fi
