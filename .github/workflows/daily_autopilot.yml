name: Daily YouTube Shorts Autopilot

on:
  schedule:
    # 02:30 UTC = 08:00 AM Indian Standard Time (IST)
    - cron: '30 2 * * *'
    # 03:00 UTC = 08:30 AM IST (Backup trigger if GitHub Actions delays)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Generate 10 Shorts & Auto-Upload to YouTube
        run: |
          python batch_runner.py --upload-yt
