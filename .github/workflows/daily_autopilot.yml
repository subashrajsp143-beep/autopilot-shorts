name: Daily YouTube Shorts Autopilot

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

on:
  schedule:
    # 05:30 UTC = 11:00 AM IST (Channel 1: MiniTalesWorld Kick-off)
    - cron: '30 5 * * *'
    # 09:30 UTC = 03:00 PM IST (Channel 2: Pawsome Productions Kick-off)
    - cron: '30 9 * * *'
    # 14:30 UTC = 08:00 PM IST (Channel 3: Next Level Facts Prime Time Kick-off)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target Channel (1, 2, 3, or all)'
        required: false
        default: 'all'
        type: string
      force:
        description: 'Force upload bypassing duplicate guard'
        required: false
        default: false
        type: boolean

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-dejavu-core

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Generate 10 Shorts & Auto-Upload to YouTube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_CH="${{ inputs.channel }}"
          if [ -z "$TARGET_CH" ] || [ "$TARGET_CH" = "all" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR_UTC=$(date -u +%H)
            if [ "$HOUR_UTC" -ge 4 ] && [ "$HOUR_UTC" -le 7 ]; then
              TARGET_CH="1"
            elif [ "$HOUR_UTC" -ge 8 ] && [ "$HOUR_UTC" -le 11 ]; then
              TARGET_CH="2"
            elif [ "$HOUR_UTC" -ge 13 ] && [ "$HOUR_UTC" -le 16 ]; then
              TARGET_CH="3"
            else
              TARGET_CH="all"
            fi
          fi

          echo "Targeting Channel: $TARGET_CH"
          CMD_ARGS="--upload-yt"
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --force"
          fi
          if [ "$TARGET_CH" != "all" ] && [ -n "$TARGET_CH" ]; then
            CMD_ARGS="$CMD_ARGS --channels $TARGET_CH"
          fi

          python batch_runner.py $CMD_ARGS

      - name: 💾 Persist Upload History & Generator State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A config/
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist uploaded history and state [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "Error: Failed to push config updates to origin main after 5 attempts."
              if [ -n "$GITHUB_STEP_SUMMARY" ]; then
                echo "### ❌ CRITICAL: Failed to Push Upload History to GitHub" >> "$GITHUB_STEP_SUMMARY"
                echo "All 5 git push attempts failed. Changes remain unpushed on the runner." >> "$GITHUB_STEP_SUMMARY"
                if [ -f "config/emergency_unconfirmed_uploads.jsonl" ]; then
                  echo "#### Emergency Unconfirmed Upload Records:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```json' >> "$GITHUB_STEP_SUMMARY"
                  cat config/emergency_unconfirmed_uploads.jsonl >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
              if [ -f "config/emergency_unconfirmed_uploads.jsonl" ]; then
                echo "Contents of config/emergency_unconfirmed_uploads.jsonl:"
                cat config/emergency_unconfirmed_uploads.jsonl
              fi
              exit 1
            fi
          fi
