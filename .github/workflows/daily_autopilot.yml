name: Daily YouTube Shorts Autopilot

on:
  schedule:
    # 02:00 UTC = 07:30 AM IST (Early warm-up trigger)
    - cron: '0 2 * * *'
    # 02:15 UTC = 07:45 AM IST (Pre-8AM trigger)
    - cron: '15 2 * * *'
    # 02:30 UTC = 08:00 AM IST (8:00 AM IST target)
    - cron: '30 2 * * *'
    # 02:45 UTC = 08:15 AM IST (Immediate backup trigger)
    - cron: '45 2 * * *'
  workflow_dispatch:

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-dejavu-core

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Generate 10 Shorts & Auto-Upload to YouTube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python batch_runner.py --upload-yt
