name: Daily YouTube Shorts Autopilot

on:
  schedule:
    # 05:15 UTC = 10:45 AM IST (Primary 24-hr quota window trigger)
    - cron: '15 5 * * *'
    # 05:30 UTC = 11:00 AM IST (Backup 24-hr quota window trigger)
    - cron: '30 5 * * *'
    # 05:45 UTC = 11:15 AM IST (Final backup trigger)
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force upload bypassing duplicate guard'
        required: false
        default: false
        type: boolean

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-dejavu-core

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Generate 10 Shorts & Auto-Upload to YouTube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python batch_runner.py --upload-yt --force
          else
            python batch_runner.py --upload-yt
          fi

      - name: 💾 Persist Upload History & Generator State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/uploaded_history.json config/generator_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist uploaded history and state [skip ci]" && git push origin main)
