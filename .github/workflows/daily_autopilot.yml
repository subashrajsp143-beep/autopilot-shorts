name: Daily YouTube Shorts Autopilot

on:
  schedule:
    # 02:00 UTC = 07:30 AM IST (Early warm-up trigger)
    - cron: '0 2 * * *'
    # 02:30 UTC = 08:00 AM IST (8:00 AM IST target)
    - cron: '30 2 * * *'
    # 05:15 UTC = 10:45 AM IST (Primary 24-hr quota window trigger)
    - cron: '15 5 * * *'
    # 05:30 UTC = 11:00 AM IST (Backup 24-hr quota window trigger)
    - cron: '30 5 * * *'
    # 05:45 UTC = 11:15 AM IST (Final backup trigger)
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force upload bypassing duplicate guard'
        required: false
        default: false
        type: boolean

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva fonts-dejavu-core

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Generate 10 Shorts & Auto-Upload to YouTube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python batch_runner.py --upload-yt --force
          else
            python batch_runner.py --upload-yt
          fi
