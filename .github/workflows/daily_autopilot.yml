name: Daily YouTube Shorts Autopilot

on:
  schedule:
    # 02:23 UTC = 07:53 AM IST (Off-peak minute avoids GitHub traffic queue, ready by 08:00 AM)
    - cron: '23 2 * * *'
    # 02:43 UTC = 08:13 AM IST (Secondary off-peak backup)
    - cron: '43 2 * * *'
  workflow_dispatch:

jobs:
  run-daily-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva

      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Generate 10 Shorts & Auto-Upload to YouTube
        run: |
          python batch_runner.py --upload-yt
